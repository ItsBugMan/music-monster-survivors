<!doctype html><html lang="en"><meta charset="utf-8"><title>Music Monster viewport checks</title>
<style>body{margin:0;background:#1d2430;color:white;font:14px system-ui}header{position:sticky;top:0;background:#1d2430;padding:10px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:8px}iframe{border:0;display:block;margin:8px auto}output{white-space:pre-wrap}h1{font-size:15px;margin:0 15px}</style>
<header><h1>Viewport test harness</h1><button data-size="390,650">Portrait</button><button data-size="844,390">Landscape</button><button data-size="1200,650">Desktop</button><button id="check">Check layout</button><output id="result">Start a run inside the frame, then change sizes.</output></header>
<iframe id="game" title="Music Monster test viewport" src="../index.html" width="1200" height="650" allow="fullscreen" allowfullscreen></iframe>
<script>
const frame=document.getElementById('game'),result=document.getElementById('result');
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;result.textContent='Viewport: '+w+' × '+h};
document.getElementById('check').onclick=()=>{
 const win=frame.contentWindow,doc=frame.contentDocument,shell=doc.querySelector('.game-shell'),canvas=doc.querySelector('.screen'),arena=doc.querySelector('.arena');
 const rect=element=>element.getBoundingClientRect(),w=win.innerWidth,h=win.innerHeight,checks=[];
 checks.push(['shell fills frame',rect(shell).width===w&&rect(shell).height===h]);
 checks.push(['body scrolling disabled',win.getComputedStyle(doc.body).overflow==='hidden'&&win.getComputedStyle(doc.documentElement).overflow==='hidden']);
 if(canvas){checks.push(['canvas fills frame',rect(canvas).width===w&&rect(canvas).height===h]);checks.push(['buffer budget',canvas.width*canvas.height<=4000000]);checks.push(['HUD above arena',!!arena.querySelector('.hud-layer')]);const gl=[...arena.querySelectorAll(':scope > canvas')].find(c=>c!==canvas);if(gl)checks.push(['WebGL matches frame',rect(gl).width===w&&rect(gl).height===h]);}
 else checks.push(['no run canvas before Play',shell.dataset.screen!=='run']);
 result.textContent=checks.map(([name,ok])=>(ok?'PASS ':'FAIL ')+name).join(' · ');
};
</script></html>
